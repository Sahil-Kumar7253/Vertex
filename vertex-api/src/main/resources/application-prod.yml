server:
  # Render dynamically assigns a port; we capture it here
  port: ${PORT:8080}

spring:
  datasource:
    # These map to the Aiven credentials you will put in Render
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate # Strictly validates the schema; it will NOT alter production tables
    show-sql: false      # Turned off to save server resources and prevent log clutter
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

cors:
  allowed-origin: ${FRONTEND_URL:http://localhost:3000}
