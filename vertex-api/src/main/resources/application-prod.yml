spring:
  datasource:
    # These variables will be pulled from your production server's environment
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate # Strictly validates the schema; it will NOT alter production tables
    show-sql: false      # Turned off to save server resources and prevent log clutter
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080