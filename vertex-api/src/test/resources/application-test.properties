# Use H2 In-Memory Database for tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Automatically create tables based on your JPA Entities
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Silence Spring Security's informational warning about the configured authentication beans.
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR

# Provide a dummy JWT secret so the context doesn't crash if it expects one
# (Replace 'jwt.secret' with whatever key you actually use in your main application.properties)
jwt.secret=this_is_a_dummy_secret_key_for_testing_purposes_only

# JwtUtil also requires an expiration value; use a short, valid test duration.
jwt.expiration=3600000

# SecurityConfig requires a frontend origin for CORS even during tests.
cors.allowed-origin=http://localhost:3000

