server:
  # Render dynamically assigns a port; we capture it here
  port: ${PORT:8080}

spring:
  datasource:
    # These map to the Aiven credentials you will put in Render
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

application:
  security:
    jwt:
      secret-key: ${JWT_SECRET}
      expiration: 86400000

cors:
  allowed-origin: ${FRONTEND_URL}