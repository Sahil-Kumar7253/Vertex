server:
  # Render dynamically assigns a port; we capture it here
  port: ${PORT:8080}

spring:
  datasource:
    # These map to the Aiven credentials you will put in Render
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate # Strictly validates the schema; it will NOT alter production tables
    show-sql: false      # SQL logging handled via logging config below
    open-in-view: false  # Explicitly disable open-in-view to prevent lazy loading issues
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        use_sql_comments: false
        format_sql: false

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

cors:
  allowed-origin: ${FRONTEND_URL:http://localhost:3000}

logging:
  level:
    root: WARN
    com.vertex: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.orm.jpa: DEBUG
    org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer: ERROR
    jakarta.persistence: DEBUG

